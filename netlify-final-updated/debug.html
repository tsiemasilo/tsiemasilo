<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Deployment Debug</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        .status {
            background: #111;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #0f0;
        }
        .error {
            border-left-color: #f00;
            color: #f00;
        }
        .success {
            border-left-color: #0f0;
            color: #0f0;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Netlify Deployment Debug Page</h1>
    <p>This page helps diagnose deployment issues</p>
    
    <div class="status">
        <h3>Expected Changes:</h3>
        <ul>
            <li>Network Management System as first project</li>
            <li>WhatsApp integration (082 806 9569)</li>
            <li>AI Call Analyzer project</li>
            <li>Coming Soon mobile apps</li>
        </ul>
    </div>
    
    <div class="status">
        <h3>Deployment Tests:</h3>
        <button onclick="testMain()">Test Main Site</button>
        <button onclick="testFunctions()">Test Functions</button>
        <button onclick="testAssets()">Test Assets</button>
        <button onclick="testAll()">Run All Tests</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        async function testMain() {
            log('Testing main site...', 'info');
            try {
                const response = await fetch('/');
                if (response.ok) {
                    const html = await response.text();
                    if (html.includes('Network Management System')) {
                        log('✓ Network Management System found in main site', 'success');
                    } else {
                        log('✗ Network Management System NOT found in main site', 'error');
                    }
                    
                    if (html.includes('082 806 9569')) {
                        log('✓ WhatsApp number found in main site', 'success');
                    } else {
                        log('✗ WhatsApp number NOT found in main site', 'error');
                    }
                    
                    if (html.includes('AI Call Analyzer')) {
                        log('✓ AI Call Analyzer found in main site', 'success');
                    } else {
                        log('✗ AI Call Analyzer NOT found in main site', 'error');
                    }
                } else {
                    log(`✗ Main site returned ${response.status}`, 'error');
                }
            } catch (error) {
                log(`✗ Main site test failed: ${error.message}`, 'error');
            }
        }
        
        async function testFunctions() {
            log('Testing Netlify functions...', 'info');
            try {
                const response = await fetch('/.netlify/functions/test-deploy');
                if (response.ok) {
                    const data = await response.json();
                    log(`✓ Function test successful: ${data.message}`, 'success');
                } else {
                    log(`✗ Function test failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`✗ Function test failed: ${error.message}`, 'error');
            }
        }
        
        async function testAssets() {
            log('Testing assets...', 'info');
            const assets = [
                '/network-management-screenshot.png',
                '/ai-call-analyzer-screenshot.png'
            ];
            
            for (const asset of assets) {
                try {
                    const response = await fetch(asset);
                    if (response.ok) {
                        log(`✓ Asset found: ${asset}`, 'success');
                    } else {
                        log(`✗ Asset not found: ${asset} (${response.status})`, 'error');
                    }
                } catch (error) {
                    log(`✗ Asset test failed: ${asset} - ${error.message}`, 'error');
                }
            }
        }
        
        async function testAll() {
            results.innerHTML = '';
            log('Running all tests...', 'info');
            await testMain();
            await testFunctions();
            await testAssets();
            log('All tests completed', 'info');
        }
        
        // Auto-run on page load
        window.addEventListener('load', testAll);
    </script>
</body>
</html>
